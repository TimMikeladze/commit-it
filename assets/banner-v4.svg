<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230">
  <defs>
    <linearGradient id="v4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#24283b"/>
    </linearGradient>
  </defs>
  <!-- Window frame -->
  <rect width="800" height="230" rx="12" fill="url(#v4bg)"/>
  <!-- Title bar -->
  <rect width="800" height="36" rx="12" fill="#16161e"/>
  <rect y="24" width="800" height="12" fill="#16161e"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="6" fill="#febc2e"/>
  <circle cx="64" cy="18" r="6" fill="#28c840"/>
  <text x="400" y="22" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="13" fill="#565f89" text-anchor="middle">~/project</text>
  <!-- Full commit output with validation -->
  <g font-family="ui-monospace, 'Cascadia Code', monospace" font-size="13">
    <text x="30" y="64" fill="#565f89">$</text>
    <text x="46" y="64" fill="#c0caf5"> npx </text>
    <text x="84" y="64" fill="#7aa2f7">commit-it</text>
    <text x="164" y="64" fill="#c0caf5"> -a</text>
    <!-- AI generation -->
    <text x="30" y="90" fill="#7aa2f7">◆</text>
    <text x="50" y="90" fill="#a9b1d6"> Generating commit message with AI...</text>
    <!-- Commit preview box -->
    <text x="30" y="114" fill="#565f89">┌</text>
    <text x="42" y="114" fill="#565f89"> Commit preview ──────────────────────────</text>
    <text x="30" y="132" fill="#565f89">│</text>
    <text x="50" y="132" fill="#c0caf5">feat</text>
    <text x="84" y="132" fill="#565f89">(</text>
    <text x="92" y="132" fill="#bb9af7">auth</text>
    <text x="126" y="132" fill="#565f89">):</text>
    <text x="140" y="132" fill="#a9b1d6"> add OAuth support for GitHub and Google</text>
    <text x="30" y="150" fill="#565f89">│</text>
    <text x="30" y="168" fill="#565f89">│</text>
    <text x="50" y="168" fill="#73daca">Closes #42</text>
    <text x="30" y="186" fill="#565f89">└──────────────────────────────────────────</text>
  </g>
  <!-- Validation + success -->
  <g font-family="ui-monospace, monospace" font-size="13">
    <text x="30" y="210" fill="#9ece6a">✓</text>
    <text x="50" y="210" fill="#9ece6a"> Validation passed</text>
    <text x="220" y="210" fill="#565f89">·</text>
    <text x="236" y="210" fill="#9ece6a"> Commit created: </text>
    <text x="382" y="210" fill="#565f89">a1b2c3d</text>
  </g>
</svg>