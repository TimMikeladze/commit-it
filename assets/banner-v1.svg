<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">
  <defs>
    <linearGradient id="v1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#24283b"/>
    </linearGradient>
    <linearGradient id="v1accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7aa2f7"/>
      <stop offset="100%" style="stop-color:#bb9af7"/>
    </linearGradient>
  </defs>
  <!-- Window frame -->
  <rect width="800" height="260" rx="12" fill="url(#v1bg)"/>
  <!-- Title bar -->
  <rect width="800" height="36" rx="12" fill="#16161e"/>
  <rect y="24" width="800" height="12" fill="#16161e"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="6" fill="#febc2e"/>
  <circle cx="64" cy="18" r="6" fill="#28c840"/>
  <text x="400" y="22" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="13" fill="#565f89" text-anchor="middle">~/project</text>
  <!-- Big title with gradient underline -->
  <text x="400" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#c0caf5" text-anchor="middle">commit-it</text>
  <rect x="300" y="88" width="200" height="2" rx="1" fill="url(#v1accent)"/>
  <text x="400" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#565f89" text-anchor="middle">Standardized git commits with AI message generation</text>
  <!-- Two-column commands -->
  <g font-family="ui-monospace, monospace" font-size="12">
    <text x="100" y="148" fill="#565f89">$</text>
    <text x="114" y="148" fill="#a9b1d6"> npx commit-it</text>
    <text x="280" y="148" fill="#565f89"># interactive flow</text>
    <text x="100" y="168" fill="#565f89">$</text>
    <text x="114" y="168" fill="#a9b1d6"> npx commit-it -m </text>
    <text x="232" y="168" fill="#e0af68">"feat: add login"</text>
    <text x="280" y="188" fill="#565f89"># non-interactive</text>
    <text x="100" y="188" fill="#565f89">$</text>
    <text x="114" y="188" fill="#a9b1d6"> npx commit-it</text>
    <text x="280" y="168" fill="#565f89"># agent auto-detects schema</text>
  </g>
  <!-- Feature pills -->
  <g transform="translate(100, 210)" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">
    <rect x="0" y="0" width="86" height="22" rx="11" fill="#1e2030"/>
    <text x="43" y="15" fill="#7aa2f7">AI commits</text>
    <rect x="94" y="0" width="96" height="22" rx="11" fill="#1e2030"/>
    <text x="142" y="15" fill="#bb9af7">agent mode</text>
    <rect x="198" y="0" width="88" height="22" rx="11" fill="#1e2030"/>
    <text x="242" y="15" fill="#9ece6a">validation</text>
    <rect x="294" y="0" width="110" height="22" rx="11" fill="#1e2030"/>
    <text x="349" y="15" fill="#e0af68">GitHub issues</text>
    <rect x="412" y="0" width="108" height="22" rx="11" fill="#1e2030"/>
    <text x="466" y="15" fill="#f7768e">custom formats</text>
    <rect x="528" y="0" width="108" height="22" rx="11" fill="#1e2030"/>
    <text x="582" y="15" fill="#73daca">multi-commit</text>
  </g>
</svg>