<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <defs>
    <linearGradient id="v2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#24283b"/>
    </linearGradient>
  </defs>
  <!-- Window frame -->
  <rect width="800" height="240" rx="12" fill="url(#v2bg)"/>
  <!-- Title bar -->
  <rect width="800" height="36" rx="12" fill="#16161e"/>
  <rect y="24" width="800" height="12" fill="#16161e"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="6" fill="#febc2e"/>
  <circle cx="64" cy="18" r="6" fill="#28c840"/>
  <text x="400" y="22" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="13" fill="#565f89" text-anchor="middle">~/project</text>
  <!-- Left: session output -->
  <g font-family="ui-monospace, 'Cascadia Code', monospace" font-size="13">
    <text x="30" y="66" fill="#565f89">$</text>
    <text x="46" y="66" fill="#c0caf5"> npx </text>
    <text x="84" y="66" fill="#7aa2f7">commit-it</text>
    <!-- clack-style interactive prompts -->
    <text x="30" y="92" fill="#7aa2f7">◆</text>
    <text x="50" y="92" fill="#a9b1d6"> Select commit type</text>
    <text x="30" y="112" fill="#565f89">│</text>
    <text x="50" y="112" fill="#9ece6a"> ● feat</text>
    <text x="112" y="112" fill="#565f89"> ○ fix  ○ docs  ○ refactor</text>
    <text x="30" y="136" fill="#7aa2f7">◆</text>
    <text x="50" y="136" fill="#a9b1d6"> Commit message</text>
    <text x="30" y="156" fill="#565f89">│</text>
    <text x="50" y="156" fill="#e0af68"> add OAuth support</text>
    <text x="30" y="180" fill="#9ece6a">◇</text>
    <text x="50" y="180" fill="#a9b1d6"> Commit preview</text>
    <text x="30" y="200" fill="#565f89">│</text>
    <text x="50" y="200" fill="#c0caf5"> feat(auth): add OAuth support</text>
  </g>
  <!-- Right side: feature list -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#565f89" transform="translate(560, 60)">
    <text x="0" y="0" fill="#c0caf5" font-size="14" font-weight="600">commit-it</text>
    <text x="0" y="28" fill="#7aa2f7">+</text><text x="16" y="28">AI message generation</text>
    <text x="0" y="48" fill="#bb9af7">+</text><text x="16" y="48">Agent auto-detection</text>
    <text x="0" y="68" fill="#9ece6a">+</text><text x="16" y="68">Format validation</text>
    <text x="0" y="88" fill="#e0af68">+</text><text x="16" y="88">GitHub integration</text>
    <text x="0" y="108" fill="#f7768e">+</text><text x="16" y="108">Custom templates</text>
    <text x="0" y="128" fill="#73daca">+</text><text x="16" y="128">Multi-commit splits</text>
  </g>
  <!-- Bottom success -->
  <text x="30" y="228" font-family="ui-monospace, monospace" font-size="13" fill="#9ece6a">✓</text>
  <text x="50" y="228" font-family="ui-monospace, monospace" font-size="13" fill="#a9b1d6"> Commit created: </text>
  <text x="196" y="228" font-family="ui-monospace, monospace" font-size="13" fill="#565f89">a1b2c3d</text>
</svg>