<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">
  <defs>
    <linearGradient id="v5bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#24283b"/>
    </linearGradient>
  </defs>
  <!-- Window frame -->
  <rect width="800" height="260" rx="12" fill="url(#v5bg)"/>
  <!-- Title bar -->
  <rect width="800" height="36" rx="12" fill="#16161e"/>
  <rect y="24" width="800" height="12" fill="#16161e"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="6" fill="#febc2e"/>
  <circle cx="64" cy="18" r="6" fill="#28c840"/>
  <text x="400" y="22" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="13" fill="#565f89" text-anchor="middle">~/project</text>
  <!-- Multi-commit split showcase -->
  <g font-family="ui-monospace, 'Cascadia Code', monospace" font-size="13">
    <text x="30" y="66" fill="#565f89">$</text>
    <text x="46" y="66" fill="#c0caf5"> npx </text>
    <text x="84" y="66" fill="#7aa2f7">commit-it</text>
    <text x="164" y="66" fill="#c0caf5"> --all --multi</text>
    <!-- Analyzing -->
    <text x="30" y="92" fill="#7aa2f7">◆</text>
    <text x="50" y="92" fill="#a9b1d6"> Analyzing changes for multi-commit split...</text>
    <!-- Plan box -->
    <text x="30" y="116" fill="#565f89">┌</text>
    <text x="42" y="116" fill="#565f89"> 3 commits ───────────────────────────────</text>
    <text x="30" y="136" fill="#565f89">│</text>
    <text x="50" y="136" fill="#c0caf5"> 1.</text>
    <text x="76" y="136" fill="#e0af68"> feat(auth): add OAuth support</text>
    <text x="30" y="154" fill="#565f89">│</text>
    <text x="76" y="154" fill="#565f89"> src/auth.ts, src/providers.ts</text>
    <text x="30" y="174" fill="#565f89">│</text>
    <text x="50" y="174" fill="#c0caf5"> 2.</text>
    <text x="76" y="174" fill="#e0af68"> fix(api): handle token expiry</text>
    <text x="30" y="192" fill="#565f89">│</text>
    <text x="76" y="192" fill="#565f89"> src/api/client.ts</text>
    <text x="30" y="212" fill="#565f89">│</text>
    <text x="50" y="212" fill="#c0caf5"> 3.</text>
    <text x="76" y="212" fill="#e0af68"> test: add auth integration tests</text>
    <text x="30" y="230" fill="#565f89">└──────────────────────────────────────────</text>
  </g>
  <!-- Success -->
  <text x="30" y="252" font-family="ui-monospace, monospace" font-size="13" fill="#9ece6a">✓</text>
  <text x="50" y="252" font-family="ui-monospace, monospace" font-size="13" fill="#a9b1d6"> Created 3 commits</text>
</svg>